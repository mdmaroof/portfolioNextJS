<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Light Theme Canvas Backdrop (Prevents Black Inversion) -->
  <rect width="512" height="512" fill="#f3f3f9" />

  <!-- Clean White Rounded Square -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="#ffffff" stroke="#e3e2e8" stroke-width="3" />

  <!-- Modern Bold Developer Code Symbol </ > in Signature Cobalt -->
  <g fill="none" stroke="#262ef2" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Bracket < -->
    <path d="M184 164L112 256L184 348" />
    <!-- Center Forward Slash / -->
    <path d="M284 148L228 364" />
    <!-- Right Bracket > -->
    <path d="M328 164L400 256L328 348" />
  </g>
</svg>
