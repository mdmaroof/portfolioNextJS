<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Light Studio Gradient -->
    <linearGradient id="bgGrad" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f4f5fc"/>
      <stop offset="1" stop-color="#e8ebf8"/>
    </linearGradient>

    <!-- Cobalt Monogram Gradient -->
    <linearGradient id="cobaltGrad" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#262ef2"/>
      <stop offset="0.7" stop-color="#4f56f5"/>
      <stop offset="1" stop-color="#6e73fa"/>
    </linearGradient>

    <!-- Subtle Ambient Drop Shadow -->
    <filter id="cardShadow" x="0" y="8" width="512" height="504" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#262ef2" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Squircle Base Chassis -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" filter="url(#cardShadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="128" stroke="#ffffff" stroke-width="6"/>
  <rect x="25" y="25" width="462" height="462" rx="127" stroke="#262ef2" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Iconic Interlocking "M M" Monogram -->
  <g fill="none" stroke="url(#cobaltGrad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left M -->
    <path d="M120 348V164L196 276L272 164V348"/>
    <!-- Right M -->
    <path d="M240 348V164L316 276L392 164V348"/>
  </g>

  <!-- Live Green Telemetry Status Dot on Corner -->
  <circle cx="392" cy="120" r="22" fill="#ffffff"/>
  <circle cx="392" cy="120" r="16" fill="#10b981"/>
</svg>
